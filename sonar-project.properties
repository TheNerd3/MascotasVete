# Configuración de SonarQube Cloud para el frontend Angular.
# SonarQube analiza el código buscando bugs, vulnerabilidades,
# código duplicado y qué parte del código cubren los tests.

sonar.organization=thenerd3
sonar.projectKey=TheNerd3_MascotasVete
sonar.projectName=MascotasVete

# Código a analizar
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/environments/**

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Reporte de cobertura generado por "ng test --coverage"
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

sonar.sourceEncoding=UTF-8
