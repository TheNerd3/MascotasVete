<mat-toolbar color="primary" class="main-layout__toolbar">
  <a routerLink="/" class="main-layout__brand">
    <mat-icon aria-hidden="true">pets</mat-icon>
    <span>Mascotas Córdoba</span>
  </a>

  <span class="main-layout__spacer"></span>

  <a mat-button routerLink="/veterinarias">Veterinarias</a>
  <a mat-button routerLink="/refugios">Refugios</a>
  <a mat-button routerLink="/adopciones">Adopciones</a>

  @if (usuario(); as datosUsuario) {
    <a mat-button routerLink="/mascotas">Mis mascotas</a>

    <button mat-button [matMenuTriggerFor]="menuUsuario">
      <mat-icon aria-hidden="true">account_circle</mat-icon>
      {{ nombreUsuario() || datosUsuario.cuil }}
    </button>
    <mat-menu #menuUsuario="matMenu">
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  } @else {
    <a mat-button routerLink="/auth/login">Ingresar</a>
    <a mat-raised-button color="accent" routerLink="/auth/registro">Registrarme</a>
  }
</mat-toolbar>

<main class="main-layout__content">
  <router-outlet />
</main>
