<app-auth-card>
  <app-brand-header icono="favorite" titulo="Mascotas Córdoba" subtitulo="Programa Municipal de Bienestar Animal" />

  <form [formGroup]="form" (ngSubmit)="enviar()" class="login-page__form">
    <app-icon-input
      label="CUIL"
      icono="person"
      placeholder="Ingrese su CUIL"
      autocomplete="username"
      formControlName="cuil"
      [errorTexto]="errorCuil"
    />

    <app-icon-input
      label="Contraseña"
      icono="lock"
      tipo="password"
      placeholder="Ingrese su contraseña"
      autocomplete="current-password"
      formControlName="clave"
      [errorTexto]="errorClave"
    />

    @if (errorMensaje(); as mensaje) {
      <p class="login-page__error" role="alert" aria-live="assertive">{{ mensaje }}</p>
    }

    <app-primary-button
      texto="Iniciar sesión"
      textoCargando="Ingresando…"
      icono="login"
      tipo="submit"
      [cargando]="cargando()"
      [deshabilitado]="form.invalid"
    />
  </form>

  <p class="login-page__footer">
    Acceso seguro al Programa Municipal de Bienestar Animal
  </p>

  @if (mostrarCredencialesPrueba) {
    <div class="login-page__credenciales-prueba">
      <p class="login-page__credenciales-prueba-titulo">Credenciales de prueba (solo en desarrollo)</p>
      @for (credencial of credencialesPrueba; track credencial.cuil) {
        <button type="button" class="login-page__credencial-prueba" (click)="usarCredencialPrueba(credencial)">
          <span class="login-page__credencial-prueba-etiqueta">{{ credencial.etiqueta }}</span>
          <span class="login-page__credencial-prueba-datos">CUIL {{ credencial.cuil }} · {{ credencial.clave }}</span>
        </button>
      }
    </div>
  }
</app-auth-card>
