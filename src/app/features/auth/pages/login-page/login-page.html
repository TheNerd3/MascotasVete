<app-auth-card>
  <app-brand-header icono="favorite" titulo="Mascotas Córdoba" subtitulo="Programa Municipal de Bienestar Animal" />

  <form [formGroup]="form" (ngSubmit)="enviar()" class="login-page__form">
    <app-icon-input
      label="CUIL"
      icono="person"
      placeholder="Ingrese su CUIL"
      autocomplete="username"
      formControlName="cuil"
      [errorTexto]="errorCuil"
    />

    <app-icon-input
      label="Contraseña"
      icono="lock"
      tipo="password"
      placeholder="Ingrese su contraseña"
      autocomplete="current-password"
      formControlName="clave"
      [errorTexto]="errorClave"
    />

    @if (errorMensaje(); as mensaje) {
      <p class="login-page__error" role="alert">{{ mensaje }}</p>
    }

    <app-primary-button
      texto="Iniciar sesión"
      icono="login"
      tipo="submit"
      [cargando]="cargando()"
      [deshabilitado]="form.invalid"
    />
  </form>

  <p class="login-page__footer">
    Acceso seguro al Programa Municipal de Bienestar Animal
  </p>
</app-auth-card>
