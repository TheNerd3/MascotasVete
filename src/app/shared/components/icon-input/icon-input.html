<div class="icon-input">
  @if (label(); as texto) {
    <label class="icon-input__label" [for]="idCampo">{{ texto }}</label>
  }

  <div
    class="icon-input__field"
    [class.icon-input__field--error]="errorTexto()"
    [class.icon-input__field--disabled]="deshabilitado()"
  >
    @if (icono(); as nombreIcono) {
      <span class="icon-input__prefijo">
        <mat-icon aria-hidden="true">{{ nombreIcono }}</mat-icon>
      </span>
    }

    <input
      #campo
      class="icon-input__input"
      [id]="idCampo"
      [type]="tipoEfectivo"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [disabled]="deshabilitado()"
      [ngModel]="valor()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="manejarInput($event)"
      (blur)="manejarBlur()"
    />

    @if (tipo() === 'password') {
      <button
        type="button"
        class="icon-input__toggle"
        [attr.aria-label]="mostrarClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        (click)="alternarMostrarClave()"
      >
        <mat-icon aria-hidden="true">{{ mostrarClave() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    }
  </div>

  @if (errorTexto(); as mensaje) {
    <p class="icon-input__error" role="alert">{{ mensaje }}</p>
  }
</div>
